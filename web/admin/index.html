<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据概览 - 花间集后台管理</title>
    <link rel="icon" href="../assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout" id="adminLayout">
      <aside class="admin-side" id="adminSide"></aside>
      <div class="admin-main">
        <header class="admin-top" id="adminTop"></header>
        <main class="admin-content">
          <div class="admin-content-inner">
            <div class="admin-page-head">
              <div>
                <h1>数据概览</h1>
                <p>统计周期：近期经营数据 · 订单 / 商品 / 用户 / 评价模块自动汇总</p>
              </div>
              <div class="admin-page-actions">
                <button class="btn btn-primary" id="refreshBtn" type="button">
                  <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 5.6"/><path d="M20 5.5V11h-5.5"/></svg>
                  刷新数据
                </button>
              </div>
            </div>

            <!-- 指标卡片 -->
            <div class="stat-grid">
              <div class="stat-card c1">
                <div class="ico">
                  <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg>
                </div>
                <div><div class="lbl">销售总额（元）</div><div class="num" id="kpiSales">0</div></div>
              </div>
              <div class="stat-card c2">
                <div class="ico">
                  <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 11h6M9 15h4"/></svg>
                </div>
                <div><div class="lbl">订单总数（笔）</div><div class="num" id="kpiOrders">0</div></div>
              </div>
              <div class="stat-card c3">
                <div class="ico">
                  <svg viewBox="0 0 24 24"><path d="M3 7h10v9H3z"/><path d="M13 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
                </div>
                <div><div class="lbl">待发货 / 待收货</div><div class="num" id="kpiShip">0</div></div>
              </div>
              <div class="stat-card c4">
                <div class="ico">
                  <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 7.2a3 3 0 0 1 0 5.6"/><path d="M21 20c0-2.2-1.4-4-3.4-4.7"/></svg>
                </div>
                <div><div class="lbl">注册用户（人）</div><div class="num" id="kpiUsers">0</div></div>
              </div>
            </div>

            <div class="alert alert-info" style="margin-bottom: 18px" id="todayTip">数据加载中…</div>

            <!-- 趋势 + 占比 -->
            <div class="chart-grid">
              <div class="panel">
                <div class="panel-head">
                  <h3>近 7 日销售趋势</h3>
                  <select class="form-control" id="trendDays" style="height: 32px; width: auto; min-width: 104px">
                    <option value="7">近 7 天</option>
                    <option value="14">近 14 天</option>
                    <option value="30">近 30 天</option>
                  </select>
                </div>
                <div class="panel-body" id="trendChart"><div class="loading">加载中…</div></div>
              </div>
              <div class="panel">
                <div class="panel-head"><h3>各分类销量占比</h3></div>
                <div class="panel-body" id="categoryChart"><div class="loading">加载中…</div></div>
              </div>
            </div>

            <!-- 热销 + 状态分布 -->
            <div class="chart-grid">
              <div class="panel">
                <div class="panel-head"><h3>热销商品 TOP 5</h3><a class="link-btn" href="flowers.html">查看全部商品</a></div>
                <div class="panel-body" id="topChart"><div class="loading">加载中…</div></div>
              </div>
              <div class="panel">
                <div class="panel-head"><h3>订单状态分布</h3></div>
                <div class="panel-body" id="statusChart"><div class="loading">加载中…</div></div>
              </div>
            </div>

            <!-- 最新订单 + 操作日志 -->
            <div class="chart-grid">
              <div class="panel">
                <div class="panel-head"><h3>最新订单</h3><a class="link-btn" href="orders.html">查看全部</a></div>
                <div class="panel-body"><div class="mini-list" id="latestOrders"><div class="loading">加载中…</div></div></div>
              </div>
              <div class="panel">
                <div class="panel-head"><h3>最近操作日志</h3></div>
                <div class="panel-body" id="logList"><div class="loading">加载中…</div></div>
              </div>
            </div>
          </div>
        </main>
        <footer class="admin-foot" id="adminFoot"></footer>
      </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/chart.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
      (function () {
        var btn = document.getElementById('refreshBtn');
        if (btn) btn.addEventListener('click', function () { location.reload(); });
      })();
    </script>
  </body>
</html>
