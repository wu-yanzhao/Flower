<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>评价管理 - 花间集后台管理</title>
    <link rel="icon" href="../assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side" id="adminSide"></aside>
      <div class="admin-main">
        <div class="admin-top" id="adminTop"></div>
        <div class="admin-content">
          <div class="admin-toolbar">
            <input class="form-control" id="kw" placeholder="搜索评价内容 / 用户 / 商品" />
            <select class="form-control" id="statusSel">
              <option value="">全部状态</option>
              <option value="visible">已展示</option>
              <option value="hidden">已隐藏</option>
            </select>
            <button class="btn btn-ghost" id="searchBtn">查询</button>
            <button class="btn btn-ghost" id="resetBtn">重置</button>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th width="60">ID</th>
                  <th width="120">用户</th>
                  <th width="180">商品</th>
                  <th>评价内容</th>
                  <th width="110">评分</th>
                  <th width="90">状态</th>
                  <th width="130">时间</th>
                  <th width="170">操作</th>
                </tr>
              </thead>
              <tbody id="tbody"><tr><td colspan="8" class="loading">加载中…</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="js/reviews.js"></script>
  </body>
</html>
