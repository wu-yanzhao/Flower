<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品管理 - 花间集后台管理</title>
    <link rel="icon" href="../assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout" id="adminLayout">
      <aside class="admin-side" id="adminSide"></aside>
      <div class="admin-main">
        <header class="admin-top" id="adminTop"></header>
        <main class="admin-content">
          <div class="admin-content-inner">
            <div class="admin-page-head">
              <div>
                <h1>商品管理</h1>
                <p>花礼信息维护：上架 / 下架、库存调整与首页推荐位管理</p>
              </div>
              <div class="admin-page-actions">
                <button class="btn btn-primary" id="addBtn" type="button">
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                  新增商品
                </button>
              </div>
            </div>

            <div class="admin-toolbar">
              <select class="form-control" id="catSel"><option value="">全部分类</option></select>
              <select class="form-control" id="statusSel">
                <option value="">全部状态</option>
                <option value="on">在售</option>
                <option value="off">已下架</option>
              </select>
              <span class="field-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                <input class="form-control" id="kw" placeholder="商品名称" />
              </span>
              <button class="btn btn-primary" id="searchBtn" type="button">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                查询
              </button>
              <button class="btn btn-ghost" id="resetBtn" type="button">重置</button>
            </div>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th width="70">ID</th>
                    <th width="80">图片</th>
                    <th>商品名称</th>
                    <th width="120">分类</th>
                    <th width="100">售价</th>
                    <th width="80">库存</th>
                    <th width="80">销量</th>
                    <th width="120">状态</th>
                    <th width="240">操作</th>
                  </tr>
                </thead>
                <tbody id="tbody"><tr><td colspan="9" class="loading">加载中…</td></tr></tbody>
              </table>
              <div class="pagination" id="pagination"></div>
            </div>
          </div>
        </main>
        <footer class="admin-foot" id="adminFoot"></footer>
      </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="js/flowers.js"></script>
  </body>
</html>
