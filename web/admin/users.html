<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户管理 - 花间集后台管理</title>
    <link rel="icon" href="../assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout" id="adminLayout">
      <aside class="admin-side" id="adminSide"></aside>
      <div class="admin-main">
        <header class="admin-top" id="adminTop"></header>
        <main class="admin-content">
          <div class="admin-content-inner">
            <div class="admin-page-head">
              <div>
                <h1>用户管理</h1>
                <p>顾客与管理员账号维护：新增、禁用 / 启用与密码重置</p>
              </div>
              <div class="admin-page-actions">
                <button class="btn btn-primary" id="addBtn" type="button">
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                  新增用户
                </button>
              </div>
            </div>

            <div class="admin-toolbar">
              <span class="field-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                <input class="form-control" id="kw" placeholder="账号 / 昵称 / 手机号" />
              </span>
              <select class="form-control" id="roleSel">
                <option value="">全部角色</option>
                <option value="customer">普通顾客</option>
                <option value="admin">管理员</option>
              </select>
              <select class="form-control" id="statusSel">
                <option value="">全部状态</option>
                <option value="active">正常</option>
                <option value="disabled">已禁用</option>
              </select>
              <button class="btn btn-primary" id="searchBtn" type="button">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                查询
              </button>
              <button class="btn btn-ghost" id="resetBtn" type="button">重置</button>
            </div>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th width="70">ID</th>
                    <th width="140">账号</th>
                    <th width="140">昵称</th>
                    <th width="140">手机号</th>
                    <th width="100">角色</th>
                    <th width="80">订单数</th>
                    <th width="110">消费金额</th>
                    <th width="100">状态</th>
                    <th width="190">操作</th>
                  </tr>
                </thead>
                <tbody id="tbody"><tr><td colspan="9" class="loading">加载中…</td></tr></tbody>
              </table>
              <div class="pagination" id="pagination"></div>
            </div>
          </div>
        </main>
        <footer class="admin-foot" id="adminFoot"></footer>
      </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="js/users.js"></script>
  </body>
</html>
