<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订单管理 - 花间集后台管理</title>
    <link rel="icon" href="../assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout" id="adminLayout">
      <aside class="admin-side" id="adminSide"></aside>
      <div class="admin-main">
        <header class="admin-top" id="adminTop"></header>
        <main class="admin-content">
          <div class="admin-content-inner">
            <div class="admin-page-head">
              <div>
                <h1>订单管理</h1>
                <p>订单查询、详情查看、发货与状态流转管理</p>
              </div>
            </div>

            <!-- 状态统计由 orders.js 写入，设计稿中以标题副文案呈现，这里保留容器但隐藏 -->
            <div class="stat-grid admin-order-stats" id="orderStats"></div>

            <div class="admin-toolbar">
              <select class="form-control" id="statusSel">
                <option value="">全部状态</option>
                <option value="pending">待付款</option>
                <option value="paid">待发货</option>
                <option value="shipped">待收货</option>
                <option value="completed">已完成</option>
                <option value="canceled">已取消</option>
              </select>
              <span class="field-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                <input class="form-control" id="kw" placeholder="订单号 / 收货人 / 手机号" />
              </span>
              <input class="form-control" id="startDate" type="date" />
              <span class="muted">至</span>
              <input class="form-control" id="endDate" type="date" />
              <button class="btn btn-primary" id="searchBtn" type="button">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
                查询
              </button>
              <button class="btn btn-ghost" id="resetBtn" type="button">重置</button>
            </div>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th width="170">订单号</th>
                    <th width="110">客户</th>
                    <th>收货信息</th>
                    <th width="100">金额</th>
                    <th width="100">状态</th>
                    <th width="150">下单时间</th>
                    <th width="220">操作</th>
                  </tr>
                </thead>
                <tbody id="tbody"><tr><td colspan="7" class="loading">加载中…</td></tr></tbody>
              </table>
              <div class="pagination" id="pagination"></div>
            </div>
          </div>
        </main>
        <footer class="admin-foot" id="adminFoot"></footer>
      </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="js/orders.js"></script>
  </body>
</html>
