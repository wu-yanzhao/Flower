<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 - 花间集鲜花商城</title>
    <link rel="icon" href="assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/shop.css" />
  </head>
  <body>
    <header id="siteHeader"></header>

    <main class="page">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="section-title">个人中心</div>
            <div class="section-sub">管理资料、收货地址、收藏与登录密码</div>
          </div>
        </div>

        <div class="user-layout">
          <aside class="user-nav" id="userNav">
            <a class="active" data-tab="profile">个人资料</a>
            <a data-tab="addresses">收货地址</a>
            <a data-tab="favorites">我的收藏</a>
            <a data-tab="security">修改密码</a>
          </aside>

          <div>
            <div class="card" style="margin-bottom: 18px">
              <div class="user-card-head">
                <div class="big-avatar" id="uAvatar">花</div>
                <div style="flex: 1">
                  <div style="font-size: 18px; font-weight: 700" id="uNickname">—</div>
                  <div class="muted text-sm" id="uAccount">—</div>
                </div>
                <button class="btn btn-ghost btn-sm" id="logoutBtn2">退出登录</button>
              </div>
              <div class="stat-row">
                <div class="stat-mini"><b id="sOrder">0</b><span>累计订单</span></div>
                <div class="stat-mini"><b id="sFav">0</b><span>我的收藏</span></div>
                <div class="stat-mini"><b id="sCart">0</b><span>购物车</span></div>
                <div class="stat-mini"><b id="sRole">顾客</b><span>账号角色</span></div>
              </div>
            </div>

            <!-- 个人资料 -->
            <div class="card tab-pane" id="pane-profile">
              <h4 style="font-size: 15px; margin-bottom: 16px">修改个人资料</h4>
              <form id="profileForm">
                <div class="form-row">
                  <div class="form-item">
                    <label class="form-label">用户昵称</label>
                    <input class="form-control" id="pNickname" />
                    <div class="form-error" data-error="nickname"></div>
                  </div>
                  <div class="form-item">
                    <label class="form-label">登录账号</label>
                    <input class="form-control" id="pUsername" disabled />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-item">
                    <label class="form-label">手机号</label>
                    <input class="form-control" id="pPhone" />
                    <div class="form-error" data-error="phone"></div>
                  </div>
                  <div class="form-item">
                    <label class="form-label">邮箱</label>
                    <input class="form-control" id="pEmail" />
                    <div class="form-error" data-error="email"></div>
                  </div>
                </div>
                <button class="btn btn-primary" type="submit">保存资料</button>
              </form>
            </div>

            <!-- 收货地址 -->
            <div class="card tab-pane" id="pane-addresses" style="display: none">
              <div class="flex-between" style="margin-bottom: 14px">
                <h4 style="font-size: 15px">收货地址管理</h4>
                <button class="btn btn-outline btn-sm" id="addAddressBtn">+ 新增地址</button>
              </div>
              <div class="address-list" id="addrList"><div class="loading">加载中…</div></div>
            </div>

            <!-- 我的收藏 -->
            <div class="card tab-pane" id="pane-favorites" style="display: none">
              <h4 style="font-size: 15px; margin-bottom: 14px">我的收藏</h4>
              <div class="flower-grid" id="favGrid"><div class="loading">加载中…</div></div>
            </div>

            <!-- 修改密码 -->
            <div class="card tab-pane" id="pane-security" style="display: none">
              <h4 style="font-size: 15px; margin-bottom: 16px">修改登录密码</h4>
              <form id="pwdForm" style="max-width: 420px">
                <div class="form-item">
                  <label class="form-label">原密码</label>
                  <input class="form-control" id="oldPwd" type="password" />
                  <div class="form-error" data-error="oldPassword"></div>
                </div>
                <div class="form-item">
                  <label class="form-label">新密码</label>
                  <input class="form-control" id="newPwd" type="password" placeholder="6-20 位" />
                  <div class="form-error" data-error="newPassword"></div>
                </div>
                <div class="form-item">
                  <label class="form-label">确认新密码</label>
                  <input class="form-control" id="confirmPwd" type="password" />
                  <div class="form-error" data-error="confirm"></div>
                </div>
                <button class="btn btn-primary" type="submit">确认修改</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="siteFooter"></footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/user.js"></script>
  </body>
</html>
