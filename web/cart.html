<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>购物车 - 花间集鲜花商城</title>
    <link rel="icon" href="assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/mobile.css" />
  </head>
  <body class="m-app" data-tab="cart" data-mback="index.html" data-mtitle="购物车">
    <header id="siteHeader"></header>

    <main class="m-main m-cart">
      <div class="m-cart-top">
        <span>确认商品与数量后前往结算</span>
        <button class="m-link-btn" id="clearCart" type="button">🗑 清空购物车</button>
      </div>

      <div id="cartBox"><div class="loading">加载中…</div></div>

      <div class="m-coupon-banner">
        <span>🧧 满 300 减 20，满 500 减 50</span>
        <span>已省 20 元</span>
      </div>

      <div class="m-note">鲜花为生鲜商品，下单后不支持修改地址，请仔细核对收货信息。</div>
    </main>

    <footer id="siteFooter" style="display: none"></footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/cart.js"></script>
  </body>
</html>
