<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>确认订单 - 花间集鲜花商城</title>
    <link rel="icon" href="assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/mobile.css" />
  </head>
  <body class="m-app" data-tab="cart" data-mback="cart.html" data-mtitle="确认订单">
    <header id="siteHeader"></header>

    <main class="m-main m-checkout">
      <div class="m-page-lead">
        <div class="m-lead-title">确认订单</div>
        <div class="m-lead-sub">请核对收货信息与商品清单</div>
      </div>

      <section class="m-card">
        <div class="m-card-head">
          <span class="m-card-title">收货地址</span>
          <button class="m-link-btn" id="addAddrBtn" type="button">+ 新增地址</button>
        </div>
        <div class="address-list" id="addressList"><div class="loading">加载中…</div></div>
      </section>

      <section class="m-card">
        <div class="m-card-head"><span class="m-card-title">商品清单</span></div>
        <div id="goodsList"><div class="loading">加载中…</div></div>
      </section>

      <section class="m-card">
        <div class="m-card-head"><span class="m-card-title">订单备注</span><span class="muted">选填</span></div>
        <textarea class="form-control" id="remarkInput" placeholder="如有特殊要求请备注（如贺卡内容、送达时间）" maxlength="100"></textarea>
        <div class="m-hint">0/100</div>
        <div class="alert alert-info" style="margin-top: 10px">
          配送说明：同城最快 2 小时送达，跨城市次日达。满 300 减 20，满 500 减 50，优惠在结算时自动计算。
        </div>
      </section>

      <section class="m-card">
        <div class="m-card-head"><span class="m-card-title">金额明细</span></div>
        <div class="m-line"><span>商品件数</span><span id="sumCount">0 件</span></div>
        <div class="m-line"><span>商品总额</span><span id="sumTotal">¥0</span></div>
        <div class="m-line"><span>优惠减免</span><span id="sumDiscount" style="color: #e4577a">-¥0</span></div>
        <div class="m-line"><span>运费</span><span style="color: #3fa76a">包邮</span></div>
        <div class="m-line m-line-total"><span>应付金额</span><b id="sumPay">¥0</b></div>
      </section>

      <div class="m-note">鲜花为生鲜商品，下单后不支持修改地址，请仔细核对收货信息。</div>
    </main>

    <div class="m-bottom-bar">
      <button class="m-btn-primary m-btn-lg" id="submitOrder" type="button">提交订单</button>
      <div class="m-bar-tip">提交后进入支付页</div>
    </div>

    <footer id="siteFooter" style="display: none"></footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/checkout.js"></script>
  </body>
</html>
