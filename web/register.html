<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户注册 - 花间集鲜花商城</title>
    <link rel="icon" href="assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/shop.css" />
  </head>
  <body>
    <header id="siteHeader"></header>

    <main class="page">
      <div class="container">
        <div class="auth-wrap">
          <div class="auth-art">
            <img src="assets/images/ui/auth-art.svg" alt="鲜花礼盒" />
            <h2>加入花间集 🌷</h2>
            <p>注册即送新人优惠券，生日当月下单可享 9 折优惠。</p>
          </div>

          <div class="auth-box">
            <h3>创建账号</h3>
            <div class="tip">请填写以下信息完成注册，注册后自动登录</div>
            <form id="registerForm" autocomplete="off">
              <div class="form-item">
                <label class="form-label"><span class="req">*</span>登录账号</label>
                <input class="form-control" id="username" placeholder="3-20 位，字母开头，可含数字下划线" />
                <div class="form-error" data-error="username"></div>
              </div>
              <div class="form-item">
                <label class="form-label"><span class="req">*</span>登录密码</label>
                <input class="form-control" id="password" type="password" placeholder="6-20 位" />
                <div class="form-error" data-error="password"></div>
              </div>
              <div class="form-item">
                <label class="form-label"><span class="req">*</span>确认密码</label>
                <input class="form-control" id="confirmPassword" type="password" placeholder="请再次输入密码" />
                <div class="form-error" data-error="confirmPassword"></div>
              </div>
              <div class="form-item">
                <label class="form-label"><span class="req">*</span>用户昵称</label>
                <input class="form-control" id="nickname" placeholder="如：林小满" />
                <div class="form-error" data-error="nickname"></div>
              </div>
              <div class="form-row">
                <div class="form-item">
                  <label class="form-label">手机号</label>
                  <input class="form-control" id="phone" placeholder="11 位手机号" />
                  <div class="form-error" data-error="phone"></div>
                </div>
                <div class="form-item">
                  <label class="form-label">邮箱</label>
                  <input class="form-control" id="email" placeholder="选填" />
                  <div class="form-error" data-error="email"></div>
                </div>
              </div>
              <button class="btn btn-primary btn-lg btn-block" type="submit" id="registerBtn">注 册</button>
            </form>
            <div class="auth-switch">已有账号？<a href="login.html">直接登录</a></div>
          </div>
        </div>
      </div>
    </main>

    <footer id="siteFooter"></footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
