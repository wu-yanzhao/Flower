<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>全部鲜花 - 花间集鲜花商城</title>
    <link rel="icon" href="assets/images/ui/favicon.svg" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/mobile.css" />
  </head>
  <body class="m-app" data-tab="category" data-mtitle="全部鲜花" data-mback="index.html">
    <header id="siteHeader"></header>

    <main class="m-main">
      <!-- 搜索 -->
      <div class="m-search-row">
        <label class="m-search">
          <span>🔍</span>
          <input id="keywordInput" placeholder="搜索鲜花名称或花语" />
        </label>
        <button class="m-btn-pink" id="keywordBtn">搜索</button>
      </div>

      <!-- 筛选栏 -->
      <div class="m-filter-bar">
        <button class="m-filter-toggle" id="filterToggle">▽ 筛选</button>
        <div class="m-quick-chips">
          <button>全部</button>
          <button>不限</button>
          <button>综合排序</button>
        </div>
        <button class="m-expand" id="expandBtn">展开筛选 ▾</button>
      </div>

      <!-- 筛选面板（展开态） -->
      <div class="m-filter-panel" id="filterPanel" hidden>
        <div class="m-filter-group">
          <div class="m-filter-label"><span>商品分类</span></div>
          <div class="m-chips" id="catFilter">
            <button class="active" data-cat="0">全部</button>
          </div>
        </div>
        <div class="m-filter-group">
          <div class="m-filter-label"><span>价格区间（元）</span></div>
          <div class="m-chips" id="priceFilter">
            <button class="active" data-min="" data-max="">不限</button>
            <button data-min="0" data-max="199">199 以下</button>
            <button data-min="200" data-max="299">200-299</button>
            <button data-min="300" data-max="459">300-459</button>
            <button data-min="460" data-max="9999">460 以上</button>
          </div>
        </div>
        <div class="m-filter-actions">
          <button class="m-btn-line" id="resetFilter">重置筛选条件</button>
          <button class="m-btn-pink" id="priceBtn">确定</button>
        </div>
        <input type="hidden" id="minPrice" />
        <input type="hidden" id="maxPrice" />
      </div>

      <!-- 排序 -->
      <div class="m-sort-row" id="sortTabs">
        <button class="active" data-sort="default">综合排序</button>
        <button data-sort="sales">销量优先</button>
        <button data-sort="price_asc">价格从低到高</button>
        <button data-sort="price_desc">价格从高到低</button>
        <button data-sort="new">最新上架</button>
        <button data-sort="rating">评分最高</button>
      </div>

      <!-- 商品列表 -->
      <div class="m-list-summary" id="listSummary">正在加载商品…</div>
      <div class="m-grid" id="flowerGrid"><div class="loading">加载中…</div></div>

      <div class="m-list-loading">加载中，正在为你准备更多花束…</div>
      <div class="pagination" id="pagination"></div>
      <div class="m-page-info" id="pageInfo"></div>
    </main>

    <footer id="siteFooter"></footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/flowers.js"></script>
    <script>
      /* 筛选面板展开 / 收起 */
      (function () {
        function ready(fn) {
          if (document.readyState !== 'loading') fn();
          else document.addEventListener('DOMContentLoaded', fn);
        }
        ready(function () {
          var panel = document.getElementById('filterPanel');
          var expandBtn = document.getElementById('expandBtn');
          var filterToggle = document.getElementById('filterToggle');

          function setOpen(open) {
            panel.hidden = !open;
            expandBtn.classList.toggle('on', open);
            filterToggle.classList.toggle('on', open);
            expandBtn.textContent = open ? '收起筛选 ▴' : '展开筛选 ▾';
          }

          expandBtn.addEventListener('click', function () {
            setOpen(panel.hidden);
          });
          filterToggle.addEventListener('click', function () {
            setOpen(panel.hidden);
          });
          document.getElementById('priceBtn').addEventListener('click', function () {
            setOpen(false);
          });
          Array.prototype.forEach.call(document.querySelectorAll('.m-quick-chips button'), function (btn) {
            btn.addEventListener('click', function () {
              setOpen(true);
            });
          });
        });
      })();
    </script>
  </body>
</html>
